name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, format: tar }
          - { goos: darwin, goarch: amd64, format: tar }
          - { goos: linux, goarch: arm64, format: tar }
          - { goos: linux, goarch: amd64, format: tar }
          - { goos: windows, goarch: amd64, format: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="groundspec_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          binary="groundspec"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then binary="groundspec.exe"; fi
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="-s -w -X github.com/ssj9685/groundspec/internal/core.Version=${version}" \
            -o "dist/${name}/${binary}" ./cmd/groundspec
          if [[ "${{ matrix.format }}" == "zip" ]]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
