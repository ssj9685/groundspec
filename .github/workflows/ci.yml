name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/groundspec
      - run: go install ./cmd/groundspec
      - run: |
          "$(go env GOPATH)/bin/groundspec" --version
          "$(go env GOPATH)/bin/groundspec" --help
      - run: npm test
      - run: bun run contracts:verify
      - run: bun run contracts:context
      - run: bun run contracts:impact:test
      - run: npm run publication:verify
