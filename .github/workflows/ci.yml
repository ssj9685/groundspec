name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/groundspec
      - run: go install ./cmd/groundspec
      - run: "$(go env GOPATH)/bin/groundspec" --help
      - run: npm test
      - run: bun run contracts:verify
      - run: bun run contracts:context
      - run: bun run contracts:impact:test
      - run: npm run publication:verify
